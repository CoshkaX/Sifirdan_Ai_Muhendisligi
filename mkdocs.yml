site_name: Sıfırdan Yapay Zeka Mühendisliği
site_description: Yapay zekâ mühendisliğini Türkçe, sıfırdan ve kendi ellerinle yazarak öğren.
site_url: https://coshkax.github.io/Sifirdan_Ai_Muhendisligi/
repo_url: https://github.com/CoshkaX/Sifirdan_Ai_Muhendisligi
edit_uri: edit/main/docs/

theme:
  name: material
  language: tr
  font:
    text: Nunito Sans
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Koyu moda geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Açık moda geç
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: tr

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  __pycache__/
  *.pyc

