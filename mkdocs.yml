site_name: Sıfırdan Yapay Zeka Mühendisliği
site_description: Yapay zekâ mühendisliğini Türkçe, sıfırdan ve kendi ellerinle yazarak öğren.
site_url: https://coshkax.github.io/Sifirdan_Ai_Muhendisligi/
repo_url: https://github.com/CoshkaX/Sifirdan_Ai_Muhendisligi
edit_uri: edit/main/docs/

theme:
  name: material
  language: tr
  custom_dir: docs/overrides
  font:
    text: Nunito Sans
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Koyu moda geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Açık moda geç
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: tr

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css?v=20261125-notes-1

extra_javascript:
  - javascripts/highlights.js?v=20261125-notes-1
  - javascripts/python-playground.js?v=20261124-8


exclude_docs: |
  __pycache__/
  *.pyc

nav:
  - Ana Sayfa: index.md
  - Öğrenme yolları: OGRENME-YOLLARI.md
  - Müfredat: MUFREDAT.md
  - 0.1 Geliştirme ortamı: faz-00-hazirlik/01-gelistirme-ortami/README.md
  - 0.2 Python hızlı tekrar: faz-00-hazirlik/02-python-hizli-tekrar/README.md
  - 0.3 Git ve GitHub: faz-00-hazirlik/03-git-ve-github/README.md
  - 0.4 Jupyter ve Colab: faz-00-hazirlik/04-jupyter-ve-colab/README.md
  - 0.5 Test ve hata ayıklama: faz-00-hazirlik/05-test-ve-hata-ayiklama/README.md
  - 0.6 Yapay zekâ nedir?: faz-00-hazirlik/06-yapay-zeka-nedir/README.md
  - 1.1 Vektörler ve matrisler: faz-01-matematik/01-vektorler-ve-matrisler/README.md
  - 1.2 Matris çarpımı: faz-01-matematik/02-matris-carpimi/README.md
  - 1.3 Türev ve gradyan: faz-01-matematik/03-turev-ve-gradyan/README.md
  - 1.4 Olasılık ve dağılımlar: faz-01-matematik/04-olasilik-ve-dagilimlar/README.md
  - 1.5 İstatistik: faz-01-matematik/05-istatistik/README.md
  - 1.6 Entropi ve çapraz entropi: faz-01-matematik/06-entropi-ve-capraz-entropi/README.md
  - 2.1 NumPy ile veri: faz-02-klasik-ml/01-numpy-ile-veri/README.md
  - 2.2 Doğrusal regresyon: faz-02-klasik-ml/02-dogrusal-regresyon/README.md
  - 2.3 Lojistik regresyon: faz-02-klasik-ml/03-lojistik-regresyon/README.md
  - 2.4 Eğitim, doğrulama ve test: faz-02-klasik-ml/04-egitim-dogrulama-test/README.md
  - 2.5 Karar ağaçları: faz-02-klasik-ml/05-karar-agaclari/README.md
  - 2.6 Sınıflandırma metrikleri: faz-02-klasik-ml/06-siniflandirma-metrikleri/README.md
  - 4.1 Metni sayılara dönüştürmek: faz-04-metin-ve-turkce-nlp/01-metni-sayilara-cevirmek/README.md
  - 4.2 Türkçe biçimbilim: faz-04-metin-ve-turkce-nlp/02-turkce-bicimbilim/README.md
  - 4.3 Metin temizleme: faz-04-metin-ve-turkce-nlp/03-metin-temizleme/README.md
  - Sözlük: SOZLUK.md
  - Katkı:
      - Katkı rehberi: CONTRIBUTING.md
      - Ders şablonu: sablon/DERS-SABLONU.md
