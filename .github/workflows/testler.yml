name: Ders kodu testleri

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Her dersin testini çalıştır
        run: |
          set -e
          for d in $(find docs -type d -name test); do
            echo "=== $d ==="
            python -m unittest discover -s "$d" -v
          done
      - name: Etkileşimli örnekleri ve görevleri doğrula
        run: python scripts/ornekleri_dogrula.py
